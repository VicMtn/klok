[package]
name = "klok"
version = "0.1.0"
description = "Klok - Time Tracking"
authors = ["you"]
edition = "2021"

[lib]
name = "klok_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
png = "0.17"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
